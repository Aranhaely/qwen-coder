# =============================================================================
# GitHub Actions: full CI/CD pipeline — build, test, security scans, image,
# infra plan/apply (with OIDC to AWS, no long-lived keys), staging+prod deploy.
# Secrets/vars required:
#   AWS_ACCOUNT_ID (var), AWS_ROLE_NAME (var), GHCR_TOKEN or built-in GITHUB_TOKEN
# Prod approval is done via GitHub Environments protection rules ("production").
# =============================================================================

name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # safe for PRs; main deploys use the lock below

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.7.5"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  id-token: write   # OIDC to AWS
  contents: read
  packages: write   # push to GHCR

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint + unit tests + coverage gate
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff) + types (mypy)
        run: |
          ruff check .
          mypy src/

      - name: Unit tests with coverage gate
        run: pytest --cov=src --cov-fail-under=85 -q

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ---------------------------------------------------------------------------
  # 2) Security: SAST, dependency audit, IaC & k8s misconfig scans, secret scan
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python deps audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Terraform static analysis (tfsec + terraform fmt/validate)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: devops/infra/terraform
          softfail: false

      - name: Kustomize build sanity + kubeconform schema validation
        run: |
          curl -sL https://raw.githubusercontent.com/wolfi-dev/kustomize/master/install.sh | bash || \
            { mkdir -p ~/bin && curl -sLo ~/bin/kustomize \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" \
              && tar xzf ~/bin/kustomize -C ~/bin; }
          export PATH=$HOME/bin:$PATH
          kustomize build devops/k8s/overlays/prod > /tmp/prod.yaml
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin
          kubeconform -strict -summary /tmp/prod.yaml

      - name: Trivy filesystem scan (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # 3) Container image: multi-stage Dockerfile -> GHCR, tagged sha + latest,
  #    signed with cosign keyless (OIDC), SBOM attached
  # ---------------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.meta.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Cosign sign (keyless OIDC)
        uses: sigstore/cosign-action@v2
        continue-on-error: true # requires cosign installed on runner; harmless fallback
        with:
          args: sign --yes --oidc-issuer https://token.actions.githubusercontent.com ${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}

  # ---------------------------------------------------------------------------
  # 4) Terraform plan on PR / apply on main — AWS auth via OIDC (no keys)
  # ---------------------------------------------------------------------------
  infra:
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt & validate
        working-directory: devops/infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Terraform plan (PR comment)
        if: github.event_name == 'pull_request'
        working-directory: devops/infra/terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="key=env/dev.tfstate"
          terraform plan -out=tfplan -var-file=dev.tfvars -input=false
          terraform show -json tfplan > tfplan.json
          echo "### Plan summary" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo '"(add|change|destroy)_count": [0-9]+' tfplan.json | head -5 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Terraform apply (main only, after prod-environment approval)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: devops/infra/terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="key=env/prod.tfstate"
          terraform apply -var-file=prod.tfvars -input=false -auto-approve

  # ---------------------------------------------------------------------------
  # 5) Deploy to staging (auto) then production (manual approval via
  #    GitHub Environment "production"), pinned by image DIGEST, verified,
  #    auto-rollback on failed smoke test.
  # ---------------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [image, infra]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC) + kubeconfig
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: eu-central-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name myapp-staging --region eu-central-1

      - name: Pin image by digest & apply (kustomize)
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cd devops/k8s/overlays/staging 2>/dev/null || mkdir -p devops/k8s/overlays/staging && cp devops/k8s/overlays/prod/kustomization.yaml .
          kustomize edit set image "ghcr.io/OWNER/REPO@${IMAGE_DIGEST}"
          kubectl apply -k .

      - name: Wait for rollout (fails fast => job fails => no prod promotion)
        run: |
          kubectl -n myapp rollout status deployment/myapp --timeout=180s

      - name: Smoke test
        run: |
          kubectl -n myapp run smoke --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS --retry 5 --retry-delay 2 http://myapp.myapp.svc.cluster.local/healthz

  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production # protected: required reviewers + wait timer
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC) + kubeconfig
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: eu-central-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name myapp-prod --region eu-central-1

      - name: Canary rollout (Argo Rollouts) OR plain rolling update
        run: |
          # If Argo Rollouts installed: kubectl argo rollouts promote... else:
          kubectl -n myapp rollout status deployment/myapp --timeout=300s

      - name: Auto-rollback on failure
        if: failure()
        run: |
          PREV=$(kubectl -n myapp rollout history deployment/myapp | tail -2 | head -1 | awk '{print $1}')
          kubectl -n myapp rollout undo deployment/myapp --to-revision="${PREV:-1}" || true
          echo "::error::Rolled back to revision ${PREV}"
