# =============================================================================
# Ansible: harden Ubuntu 22.04/24.04 servers (CIS-style) + Docker + unattended
# upgrades + fail2ban + structured logging. Idempotent, check-mode friendly.
# Usage:
#   ansible-playbook -i inventory/prod.yml playbooks/harden.yml --check --diff
#   ansible-vault encrypt_string 'ssh_pass' --name 'ansible_password'
# Vaulted secrets live in group_vars/all/vault.yml (never commit plaintext).
# =============================================================================

- name: Harden Linux servers
  hosts: all
  become: true
  gather_facts: true

  vars:
    admin_users: ["deploy"]
    ssh_allow_groups: "ssh-users"
    timezone: "UTC"
    fail2ban_maxretry: 5
    fail2ban_bantime: 3600

  pre_tasks:
    - name: Assert supported OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_major_version in ['22', '24']
        fail_msg: "This playbook targets Ubuntu 22.04/24.04 only."

  tasks:
    # ---------------------------------------------------------------- packages
    - name: Update apt cache & clean
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        autoclean: true
        autoremove: true

    - name: Install baseline tooling
      ansible.builtin.package:
        name:
          - curl
          - git
          - htop
          - unzip
          - acl
          - ca-certificates
          - gnupg
          - unattended-upgrades
          - fail2ban
          - ntpsec
          - auditd

    # ------------------------------------------------------------------ users
    - name: Create ssh-users group
      ansible.builtin.group:
        name: "{{ ssh_allow_groups }}"
        state: present

    - name: Create admin users with keys
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ ssh_allow_groups }},sudo"
        append: true
        shell: /bin/bash
        authorize_key:
          - key: "ssh-ed25519 AAAA...PLACEHOLDER_ADMIN_KEY user@example.com"
            comment: admin-key
      loop: "{{ admin_users }}"

    # -------------------------------------------------------------------- SSH
    - name: SSH hardening (drop-in config)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AllowGroups {{ ssh_allow_groups }}
          X11Forwarding no
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
          LoginGraceTime 30
          AllowTcpForwarding no
          Banner /etc/issue.net
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    # --------------------------------------------------------------- firewall
    - name: UFW ruleset
      community.general.ufw:
        direction: "{{ item.direction | default(omit) }}"
        policy: "{{ item.policy | default(omit) }}"
        rule: "{{ item.rule | default(omit) }}"
        port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default(omit) }}"
        comment: "{{ item.comment | default(omit) }}"
      loop:
        - { policy: deny, direction: incoming }
        - { policy: allow, direction: outgoing }
        - { rule: allow, port: 22, proto: tcp, comment: ssh }
        - { rule: allow, port: 443, proto: tcp, comment: https }

    # ------------------------------------------------------------- sysctl net
    - name: Kernel network hardening
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-hardening.conf
      loop:
        - { key: net.ipv4.tcp_syncookies, value: "1" }
        - { key: net.ipv4.conf.all.rp_filter, value: "1" }
        - { key: net.ipv4.conf.all.accept_redirects, value: "0" }
        - { key: net.ipv4.conf.all.send_redirects, value: "0" }
        - { key: net.ipv4.ip_forward, value: "0" }
        - { key: net.ipv6.conf.all.disable_ipv6, value: "1" }
        - { key: kernel.kptr_restrict, value: "2" }
        - { key: kernel.dmesg_restrict, value: "1" }

    # ------------------------------------------------------ core dumps / limits
    - name: Disable core dumps for setuid
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-hardening.conf
        content: "* hard core 0\n"
        mode: "0644"

    # --------------------------------------------------- unattended upgrades
    - name: Enable unattended-upgrades schedule
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        mode: "0644"

    - name: Unattended-upgrades security-only policy
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
          };
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";

    # ----------------------------------------------------------- fail2ban
    - name: Fail2ban jail.local
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        mode: "0644"
        content: |
          [DEFAULT]
          bantime  = {{ fail2ban_bantime }}
          maxretry = {{ fail2ban_maxretry }}
          backend  = systemd
          ignoreip = 127.0.0.1/8 ::1

          [sshd]
          enabled = true
          port    = 22
          mode    = aggressive

    # -------------------------------------------------------------- docker
    - name: Install Docker from official repo
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_users: "{{ admin_users }}"

    # --------------------------------------------------------------- time
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    # ------------------------------------------------------------- motd/banner
    - name: Legal banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: |
          ******************************************************************
          AUTHORIZED USE ONLY. All activity is logged and monitored.
          Unauthorized access is prohibited and may be prosecuted.
          ******************************************************************
        mode: "0644"

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
