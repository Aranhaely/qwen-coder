# =============================================================================
# Prometheus + Grafana via kube-prometheus-stack (Helm values).
# Includes: alertmanager -> Slack webhook, custom alerts, dashboards provisioning.
# Install: helm upgrade -i kps prometheus-community/kube-prometheus-stack \
#            -n monitoring --create-namespace -f values.yaml
# =============================================================================

fullnameOverride: kps

grafana:
  enabled: true
  adminPassword: "" # set via secret ref in CI; do NOT store here
  ingress:
    enabled: true
    ingressClassName: alb
    hosts: [grafana.internal.example.com]
    tls: []
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: ops
          orgId: 1
          folder: Ops
          type: file
          disableDeletion: true
          options:
            path: /var/lib/grafana/dashboards/ops
  dashboardsConfigMaps:
    ops: myapp-grafana-dashboards

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      - job_name: myapp
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: myapp
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replacelabels
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-critical
      group_by: ["alertname", "severity", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="info"']
          receiver: "null"
    receivers:
      - name: "null"
      - name: slack-critical
        slack_configs:
          - api_url: https://hooks.slack.com/services/T000/B000/XXXXX # from secret
            channel: "#alerts-prod"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔥 {{ .CommonLabels.alertname }}{{ else }}✅ resolved{{ end }}'
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

prometheusOperator:
  admissionWebhooks:
    enabled: true

kubelet:
  enabled: true

defaultRules:
  create: true
  rules:
    alerting: true
    groups:
      node: true
      kubernetesApps: true
      kubernetesResources: true
      kubernetesStorage: true
      kubernetesSystem: true
