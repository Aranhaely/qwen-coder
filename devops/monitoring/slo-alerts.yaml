# Custom PrometheusRule: SLO-based alerts + classic infra signals.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myapp-slo-alerts
  namespace: monitoring
  labels:
    release: kps # picked up by kube-prometheus-stack ruleSelector
spec:
  groups:
    - name: availability.slo
      rules:
        - alert: HighErrorRate5m
          expr: |
            (
              sum(rate(http_requests_total{namespace="myapp",code=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{namespace="myapp"}[5m]))
            ) > 0.01
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "5xx error rate >1% over 5m ({{ $value | humanizePercentage }})"

        - alert: P99LatencySLOBreach
          expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="myapp"}[10m])) by (le)) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "p99 latency > 500ms — burning error budget"

    - name: infrastructure
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="myapp"}[15m]) * 60 * 15 > 3
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "Pod {{ $labels.pod }} crash-looping"

        - alert: NodeMemoryPressure
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Node {{ $labels.instance }} has <10% memory available"

        - alert: EBSVolumeAlmostFull
          expr: |
            (kubelet_volume_stats_used_bytes{namespace="myapp"} /
             kubelet_volume_stats_capacity_bytes{namespace="myapp"}) > 0.85
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} >85% used"
